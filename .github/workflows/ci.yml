name: Continuous Integration

"on":
    push:
        branches: ["main"]
        paths-ignore:
          - "*.md"
          - "docs/**"
    pull_request:
        branches: ["main"]
        paths-ignore:
          - "*.md"
          - "docs/**"
    schedule:
        - cron: "0 0 * * MON"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    ANSICON: 1

jobs:
    monorepo:
        name: Validate monorepo
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
                  tools: composer, castor

            - name: Validate packages and root composer.json
              run: castor monorepo:validate

            - name: Validate composer.json files
              run: |
                  composer validate --no-check-publish --no-check-lock
                  for package in src/*/; do
                      echo "::group::${package}"
                      composer validate --no-check-publish --no-check-lock --working-dir="${package}"
                      echo "::endgroup::"
                  done

    cs-fixer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer, castor

            - name: PHP CS Fixer
              run: castor qa:cs --dry-run

    phpstan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer, castor

            - name: Install packages
              run: composer install --prefer-dist --no-progress

            - name: Run PHPStan
              run: castor qa:phpstan

    phpunit:
        name: Run PHPUnit
        timeout-minutes: 20
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.4"
                    extensions: xml, simplexml, dom, gd
                    coverage: none
                    tools: 'composer:v2, flex'

            -   name: Install packages
                run: composer install --prefer-dist --no-progress

            -   name: Run PHPUnit
                run: vendor/bin/phpunit

    package-tests:
        name: "Package ${{ matrix.package.name }} (isolated)"
        needs: monorepo-packages
        timeout-minutes: 20
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJson(needs.monorepo-packages.outputs.packages) }}
        steps:
            -   uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.4"
                    extensions: xml, simplexml, dom, gd
                    coverage: none
                    tools: composer:v2

            # Install the package alone (internal dependencies resolved from the monorepo
            # through path repositories) to make sure it does not rely on another one.
            -   name: Install the package in isolation
                working-directory: ${{ matrix.package.path }}
                run: |
                    composer config repositories.monorepo '{"type": "path", "url": "../*", "options": {"symlink": false, "versions": {"opencolibri/starter-core": "dev-main"}}}'
                    composer config minimum-stability dev
                    composer config prefer-stable true
                    composer require --dev --no-update "phpunit/phpunit:^13.2" "jolicode/castor:^1.6"
                    COMPOSER_ROOT_VERSION=dev-main composer update --prefer-dist --no-progress

            -   name: Run the package tests
                working-directory: ${{ matrix.package.path }}
                run: |
                    if [ ! -d tests ]; then
                        echo "No tests for this package."
                        exit 0
                    fi
                    vendor/bin/phpunit --bootstrap vendor/autoload.php tests

    monorepo-packages:
        name: List packages
        runs-on: ubuntu-latest
        outputs:
            packages: ${{ steps.packages.outputs.packages }}
        steps:
            -   uses: actions/checkout@v6

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    coverage: none

            -   id: packages
                run: echo "packages=$(php .github/scripts/monorepo-matrix.php)" >> "$GITHUB_OUTPUT"

    tasks-matrix:
        name: Select the tasks
        runs-on: ubuntu-latest
        outputs:
            tasks: ${{ steps.tasks.outputs.tasks }}
        steps:
            -   uses: actions/checkout@v6
                with:
                    # The pull request merge commit and its first parent (the base branch)
                    fetch-depth: 2

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    coverage: none

            # A pull request runs the tasks its changes affect, a push or the weekly run every task.
            -   id: tasks
                run: |
                    if [ "${{ github.event_name }}" = "pull_request" ]; then
                        tasks=$(git diff --name-only HEAD^1 HEAD | php .github/scripts/tasks-matrix.php 2> /tmp/reasons)
                    else
                        tasks=$(php .github/scripts/tasks-matrix.php --all 2> /tmp/reasons)
                    fi
                    echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"
                    {
                        echo "### Tasks selected"
                        echo
                        echo "${tasks}" | php -r 'foreach (json_decode(stream_get_contents(STDIN)) as $t) echo "- {$t->name}\n";'
                        echo
                        echo "<details><summary>Why</summary>"
                        echo
                        echo '```'
                        cat /tmp/reasons
                        echo '```'
                        echo "</details>"
                    } >> "$GITHUB_STEP_SUMMARY"

    test-application:
        name: Build the test application
        needs: tasks-matrix
        if: needs.tasks-matrix.outputs.tasks != '[]'
        timeout-minutes: 30
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to registry
              shell: bash
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

            - uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
                  tools: composer, castor

            - name: Setup Sylius
              run: composer create-project sylius/sylius-standard app --no-interaction

            - name: Build Docker images
              run: |
                  docker image ls --format '{{.Repository}}:{{.Tag}}' | sort > /tmp/images-before
                  castor build
                  docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>' | sort > /tmp/images-after
                  comm -13 /tmp/images-before /tmp/images-after > /tmp/images
                  echo "Built images:" && cat /tmp/images

            # The app directory is archived with tar to keep permissions and symlinks
            # (upload-artifact does not), and the images are exported to be loaded by
            # every task instead of being rebuilt.
            - name: Export the test application
              run: |
                  mkdir -p test-application
                  tar -cf - app | zstd -T0 -q -o test-application/app.tar.zst
                  docker save $(cat /tmp/images) | zstd -T0 -q -o test-application/images.tar.zst
                  ls -lh test-application

            - uses: actions/upload-artifact@v4
              with:
                  name: test-application
                  path: test-application
                  retention-days: 1
                  compression-level: 0

    tasks:
        name: ${{ matrix.command.name }}
        needs: [tasks-matrix, test-application]
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                command: ${{ fromJson(needs.tasks-matrix.outputs.tasks) }}
        runs-on: ubuntu-latest
        steps:
            - name: Log in to registry
              shell: bash
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

            - uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
                  tools: composer, castor

            - uses: actions/download-artifact@v4
              with:
                  name: test-application
                  path: test-application

            - name: Restore the test application
              run: |
                  zstd -d -q -c test-application/app.tar.zst | tar -xf -
                  zstd -d -q -c test-application/images.tar.zst | docker load
                  rm -rf test-application

            - name: Run Docker
              run: castor up

            - name: Run Database migrations
              run: castor app:db:migrate

            - name: "Run '${{ matrix.command.name }}'"
              run: "${{ matrix.command.value }}"
